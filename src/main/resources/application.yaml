spring:
  application:
    name: mudda
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mudda}
    username: ${DB_USERNAME:mudda}
    password: ${DB_PASSWORD:mudda}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
  docker:
    compose:
      lifecycle-management: start-and-stop
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      credentials:
        access-key: ${AWS_ACCESS_KEY:}
        secret-key: ${AWS_SECRET_KEY:}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

mudda:
  crypto:
    # Base64-encoded 32-byte AES key. Deliberately has no default: losing or silently defaulting this key
    # means every capsule body already in the database becomes permanently unreadable.
    master-key: ${MUDDA_MASTER_KEY}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

oauth:
  kakao:
    client-id: ${OAUTH_KAKAO_CLIENT_ID:}
    client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
  google:
    client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
    client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
  apple:
    client-id: ${OAUTH_APPLE_CLIENT_ID:}
    team-id: ${OAUTH_APPLE_TEAM_ID:}
    key-id: ${OAUTH_APPLE_KEY_ID:}
    private-key: ${OAUTH_APPLE_PRIVATE_KEY:}

media:
  storage:
    bucket: ${MEDIA_STORAGE_BUCKET:mudda-media}
    upload-url-expiration: ${MEDIA_UPLOAD_URL_EXPIRATION:10m}
    access-url-expiration: ${MEDIA_ACCESS_URL_EXPIRATION:5m}
    max-image-size: ${MEDIA_MAX_IMAGE_SIZE:10485760}
    max-voice-size: ${MEDIA_MAX_VOICE_SIZE:20971520}
    max-video-size: ${MEDIA_MAX_VIDEO_SIZE:104857600}
    pending-retention: ${MEDIA_PENDING_RETENTION:1d}
  cleanup:
    # Reclaims media rows that were registered but never attached to a capsule. Runs at 04:00 daily.
    cron: ${MEDIA_CLEANUP_CRON:0 0 4 * * *}

capsule:
  key-share-cleanup:
    # Removes CEK shares of expired capsules, which can never be opened again. Runs at 04:30 daily.
    cron: ${CAPSULE_KEY_SHARE_CLEANUP_CRON:0 30 4 * * *}
  open-radius-meter: ${CAPSULE_OPEN_RADIUS_METER:100}
  max-active-per-member: ${CAPSULE_MAX_ACTIVE_PER_MEMBER:100}
  max-expiration-years: ${CAPSULE_MAX_EXPIRATION_YEARS:10}
  max-nearby-radius-meter: ${CAPSULE_MAX_NEARBY_RADIUS_METER:5000}

fcm:
  # Off by default so the app boots without Firebase credentials (tests, CI, local dev). Notifications are
  # still persisted and served by the API when disabled -- only the push banner is skipped.
  enabled: ${FCM_ENABLED:false}
  # Spring resource location of the service-account JSON, e.g. file:/etc/mudda/firebase.json
  credentials: ${FCM_CREDENTIALS:}
