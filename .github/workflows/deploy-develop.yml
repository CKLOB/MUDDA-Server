name: Deploy Develop to GSMSV

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run build and validation without SSH, deployment, or Discord notification
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: gsmsv-develop-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'CKLOB/MUDDA-Server' &&
      github.ref == 'refs/heads/develop' &&
      ((github.event_name == 'workflow_dispatch' && inputs.dry_run == true) ||
      vars.CD_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out trusted develop revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and deploy
        env:
          CD_ENABLED: ${{ vars.CD_ENABLED }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/mudda' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash ops/deploy/deploy.sh
